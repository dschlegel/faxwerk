; Colors of the Faxwerk desktop app, one section per appearance.
; faxwerk.qss and style sheets in the code refer to a color as @name (for
; example "background: @surface;"); src/gui/Theme.cpp fills in the value of
; the current appearance. Every section must name every color as #rrggbb;
; tst_guilogic checks that.

; Hell
[light]
window              = #faf5f0  ; page background
surface             = #ffffff  ; cards, inputs, lists
text                = #1f1d24
muted               = #6b6075  ; secondary text
accentText          = #4f3661  ; navigation, field labels, secondary buttons
deep                = #4f3661  ; dark cards (sending progress, setup help)
onDark              = #ffffff  ; text on deep
onDarkMuted         = #e2d2ec  ; secondary text on deep
lilac               = #ebe0f0  ; chips, selected navigation, info banners
lilacHover          = #e2d2ec
lilacSoft           = #f5ecf2  ; hover and selection backgrounds
border              = #e2d2ec
divider             = #efe6f3
scroll              = #d9cfe0  ; scroll bars, sheet outlines
primary             = #7a5a8b  ; main action
primaryHover        = #6a4a7b
primaryPressed      = #4f3661
primaryDisabled     = #cbbcd3
primaryDisabledText = #ffffff
onPrimary           = #ffffff  ; text on primary
link                = #6a4a7b
focus               = #1f1d24  ; focus ring of the main action
focusBorder         = #4f3661  ; focus ring of other controls
dashed              = #b9a0c9  ; "add PDF" tile
disabledBg          = #f7f2f5
disabledText        = #a99fb1
navDisabled         = #b3a8bb  ; disabled top bar
pillBg              = #ffffff  ; current step on deep
pillText            = #4f3661
okBg                = #e4f1ea  ; status pills and banners
okText              = #1f5c41
warnBg              = #fbeee4
warnText            = #8a3f0c
failBg              = #f8e1e1
failText            = #8e2626
success             = #2f7d5b  ; status dots and check marks
warning             = #9a4a12
error               = #8e2626
searching           = #b9a0c9  ; status dot while searching

